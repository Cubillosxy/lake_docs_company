<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Empresa AI y Marketing</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Dashboard estratégico y operativo de la empresa">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Theme: Dark/Light by default -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  
  <style>
    :root {
      --theme-color: #00e5ff;
      --base-font-size: 16px;
      --cover-background-color: #0d1117;
      --cover-heading-color: #00e5ff;
      --heading-color: #00e5ff;
      --link-color: #00e5ff;
    }
    
    /* Estilos personalizados para darle un toque tech/AI */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    
    .cover-main h1 {
      background: -webkit-linear-gradient(45deg, #00e5ff, #b224ef);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      font-size: 4rem !important;
    }

    .cover-main blockquote {
      font-size: 1.5rem;
      color: #8b949e;
    }

    .markdown-section h1, .markdown-section h2 {
      border-bottom: 1px solid #30363d;
      padding-bottom: 0.3em;
    }
    
    .markdown-section ul li {
      margin-bottom: 10px;
    }
    
    /* Checkbox list styling for tasks */
    .task-list-item {
      list-style-type: none;
    }
  </style>
</head>
<body>
  <div id="app">Inicializando motores de IA...</div>
  <script>
    window.$docsify = {
      name: '<span>🤖 Panel Base</span>',
      repo: '',
      loadSidebar: false, 
      homepage: 'index.md',
      coverpage: true,
      onlyCover: false,
      auto2top: true,
      themeColor: '#00e5ff'
    }
  </script>
  <!-- Docsify Core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Plugin for Emojis -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
</body>
</html>
