<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard — Agencia de Marketing e IA</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Dashboard estratégico y operativo — Agencia de Marketing e IA en Colombia">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Docsify Theme Base -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">

  <style>
    /* ===================== CSS VARIABLES ===================== */
    :root {
      /* Backgrounds */
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: rgba(255, 255, 255, 0.04);
      --bg-card-hover: rgba(255, 255, 255, 0.08);
      --bg-glass: rgba(255, 255, 255, 0.06);

      /* Text */
      --text-primary: #f0f0f5;
      --text-secondary: #a0a0b5;
      --text-muted: #6b6b80;

      /* Accents */
      --accent-1: #6366f1;
      --accent-2: #8b5cf6;
      --accent-3: #a78bfa;
      --accent-cyan: #00e5ff;
      --gradient-primary: linear-gradient(135deg, #6366f1, #8b5cf6, #a78bfa);
      --gradient-card: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.05));

      /* Borders & Shadows */
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(99, 102, 241, 0.3);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 24px rgba(0, 0, 0, 0.4);
      --shadow-glow: 0 0 30px rgba(99, 102, 241, 0.15);

      /* Sizes */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);

      /* Docsify overrides */
      --theme-color: #8b5cf6;
      --base-font-size: 16px;
      --base-font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --base-line-height: 1.7;
      --base-color: var(--text-secondary);
      --base-background-color: var(--bg-primary);

      /* Cover */
      --cover-background-color: var(--bg-primary);
      --cover-heading-color: var(--text-primary);
      --cover-color: var(--text-secondary);

      /* Sidebar */
      --sidebar-background: var(--bg-secondary);
      --sidebar-border-color: var(--border-subtle);
      --sidebar-nav-link-color--active: var(--accent-2);

      /* Content */
      --heading-color: var(--text-primary);
      --heading-h1-color: var(--text-primary);
      --heading-h2-color: var(--text-primary);
      --heading-h2-border-color: var(--border-subtle);
      --link-color: var(--accent-3);
      --link-color--hover: var(--accent-1);

      /* Code */
      --code-inline-background: rgba(139, 92, 246, 0.12);
      --code-inline-color: var(--accent-3);
      --code-block-background: #0d0d14;
      --code-block-border-radius: var(--radius-md);

      /* Blockquote */
      --blockquote-border-color: var(--accent-2);
      --blockquote-background: var(--bg-glass);
      --blockquote-border-width: 3px;

      /* Table */
      --table-head-background: rgba(99, 102, 241, 0.15);
      --table-row-odd-background: rgba(255, 255, 255, 0.02);
      --table-row-even-background: transparent;
      --table-cell-border-color: var(--border-subtle);
    }

    /* ===================== GLOBAL ===================== */
    body {
      font-family: var(--base-font-family) !important;
      background: var(--bg-primary) !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    ::selection {
      background: var(--accent-1);
      color: #fff;
    }

    /* ===================== SCROLLBAR ===================== */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.3);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(139, 92, 246, 0.5);
    }

    /* ===================== COVER PAGE ===================== */
    section.cover {
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 40%, #16213e 70%, #0a0a0f 100%) !important;
      min-height: 100vh;
    }

    section.cover::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(0, 229, 255, 0.04) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    section.cover .cover-main {
      position: relative;
      z-index: 1;
    }

    section.cover h1 {
      background: linear-gradient(135deg, #f0f0f5 0%, #a78bfa 50%, #6366f1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 900 !important;
      font-size: clamp(2.5rem, 6vw, 4.5rem) !important;
      letter-spacing: -1px;
      line-height: 1.1 !important;
      margin-bottom: 0.5em !important;
    }

    section.cover blockquote {
      background: none !important;
      border: none !important;
      font-size: 1.3rem !important;
      color: var(--text-secondary) !important;
      font-weight: 300;
      max-width: 600px;
      margin: 0 auto 2em !important;
      padding: 0 !important;
    }

    section.cover blockquote p {
      color: var(--text-secondary) !important;
    }

    section.cover ul {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      list-style: none !important;
      padding: 0 !important;
      margin: 0 0 2.5em 0 !important;
    }

    section.cover ul li {
      background: var(--bg-glass);
      border: 1px solid var(--border-subtle);
      border-radius: 50px;
      padding: 8px 20px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: var(--transition);
    }

    section.cover ul li:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-accent);
      color: var(--text-primary);
    }

    section.cover .cover-main > p:last-child a {
      display: inline-block;
      padding: 14px 32px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1rem;
      text-transform: none;
      letter-spacing: 0;
      transition: var(--transition);
      margin: 0 8px;
    }

    section.cover .cover-main > p:last-child a:first-child {
      background: var(--gradient-primary);
      color: #fff !important;
      border: none;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
    }

    section.cover .cover-main > p:last-child a:first-child:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(99, 102, 241, 0.5);
    }

    section.cover .cover-main > p:last-child a:last-child {
      background: transparent;
      color: var(--accent-3) !important;
      border: 1px solid var(--border-accent);
    }

    section.cover .cover-main > p:last-child a:last-child:hover {
      background: rgba(99, 102, 241, 0.1);
      transform: translateY(-2px);
    }

    /* ===================== NAVBAR ===================== */
    .app-nav {
      background: rgba(10, 10, 15, 0.85) !important;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle);
    }

    /* ===================== CONTENT AREA ===================== */
    .markdown-section {
      max-width: 900px !important;
      padding: 40px 45px 60px !important;
    }

    /* ===================== HEADINGS ===================== */
    .markdown-section h1 {
      font-size: clamp(1.8rem, 4vw, 2.4rem) !important;
      font-weight: 800 !important;
      letter-spacing: -0.5px;
      margin: 2em 0 0.8em !important;
      background: linear-gradient(135deg, var(--text-primary), var(--accent-3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .markdown-section h1:first-child {
      margin-top: 0 !important;
    }

    .markdown-section h2 {
      font-size: clamp(1.3rem, 3vw, 1.7rem) !important;
      font-weight: 700 !important;
      color: var(--text-primary) !important;
      border-bottom: none !important;
      border-left: 3px solid var(--accent-2);
      padding: 8px 0 8px 16px !important;
      margin: 2.5em 0 1em !important;
      position: relative;
    }

    .markdown-section h3 {
      font-size: 1.15rem !important;
      font-weight: 600 !important;
      color: var(--accent-3) !important;
      margin: 1.8em 0 0.6em !important;
      letter-spacing: 0.3px;
    }

    /* ===================== PARAGRAPHS ===================== */
    .markdown-section p {
      color: var(--text-secondary);
      line-height: 1.8;
      margin-bottom: 1.2em;
    }

    /* ===================== LISTS ===================== */
    .markdown-section ul, .markdown-section ol {
      padding-left: 1.5em;
    }

    .markdown-section ul li, .markdown-section ol li {
      margin-bottom: 10px;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .markdown-section ul li strong {
      color: var(--text-primary);
    }

    /* ===================== BLOCKQUOTES (Glass Cards) ===================== */
    .markdown-section blockquote {
      background: var(--bg-glass) !important;
      border-left: 3px solid var(--accent-2) !important;
      border-radius: 0 var(--radius-md) var(--radius-md) 0 !important;
      padding: 16px 20px !important;
      margin: 1.5em 0 !important;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: var(--shadow-sm);
      border-top: 1px solid var(--border-subtle);
      border-right: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
    }

    .markdown-section blockquote p {
      color: var(--text-secondary) !important;
      margin-bottom: 0.3em;
    }

    .markdown-section blockquote strong {
      color: var(--accent-3);
    }

    /* ===================== TABLES ===================== */
    .markdown-section table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-sm);
      margin: 1.5em 0;
      font-size: 0.9em;
    }

    .markdown-section table thead {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(139, 92, 246, 0.1)) !important;
    }

    .markdown-section table thead th {
      color: var(--text-primary) !important;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.8em;
      letter-spacing: 1px;
      padding: 14px 16px !important;
      border-bottom: 1px solid var(--border-accent) !important;
      text-align: left;
    }

    .markdown-section table tbody td {
      padding: 12px 16px !important;
      border-bottom: 1px solid var(--border-subtle) !important;
      color: var(--text-secondary);
      vertical-align: top;
    }

    .markdown-section table tbody tr {
      transition: var(--transition);
    }

    .markdown-section table tbody tr:hover {
      background: var(--bg-card-hover) !important;
    }

    .markdown-section table tbody tr:last-child td {
      border-bottom: none !important;
    }

    /* ===================== CODE ===================== */
    .markdown-section code {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 0.88em;
    }

    .markdown-section code:not([class*="lang-"]):not([class*="language-"]) {
      background: var(--code-inline-background) !important;
      color: var(--accent-3) !important;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 500;
    }

    .markdown-section pre {
      background: var(--code-block-background) !important;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md) !important;
      padding: 20px !important;
      box-shadow: var(--shadow-md);
      position: relative;
    }

    .markdown-section pre code {
      color: var(--text-secondary) !important;
      font-size: 0.88em;
      line-height: 1.6;
    }

    /* ===================== TASK LIST ===================== */
    .markdown-section .task-list-item {
      list-style-type: none !important;
      position: relative;
      padding-left: 8px;
    }

    .markdown-section input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid var(--border-accent);
      border-radius: 5px;
      background: var(--bg-glass);
      cursor: pointer;
      vertical-align: middle;
      margin-right: 8px;
      position: relative;
      transition: var(--transition);
    }

    .markdown-section input[type="checkbox"]:checked {
      background: var(--gradient-primary);
      border-color: var(--accent-1);
    }

    .markdown-section input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 12px;
      font-weight: 700;
    }

    /* ===================== LINKS ===================== */
    .markdown-section a {
      color: var(--accent-3) !important;
      text-decoration: none;
      position: relative;
      transition: var(--transition);
    }

    .markdown-section a:hover {
      color: var(--accent-1) !important;
    }

    .markdown-section a:not([class])::after {
      content: '';
      position: absolute;
      width: 0;
      height: 1px;
      bottom: -1px;
      left: 0;
      background: var(--accent-1);
      transition: width var(--transition);
    }

    .markdown-section a:not([class]):hover::after {
      width: 100%;
    }

    /* ===================== HORIZONTAL RULES ===================== */
    .markdown-section hr {
      border: none !important;
      height: 1px !important;
      background: linear-gradient(to right, transparent, var(--border-accent), transparent) !important;
      margin: 3em 0 !important;
    }

    /* ===================== IMAGES ===================== */
    .markdown-section img {
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
    }

    /* ===================== SEARCH ===================== */
    .search {
      border-bottom: 1px solid var(--border-subtle) !important;
    }

    .search input {
      background: var(--bg-glass) !important;
      color: var(--text-primary) !important;
      border: 1px solid var(--border-subtle) !important;
      border-radius: var(--radius-sm) !important;
      padding: 8px 12px !important;
      font-family: var(--base-font-family) !important;
    }

    .search input::placeholder {
      color: var(--text-muted) !important;
    }

    .search .matching-post {
      border-bottom: 1px solid var(--border-subtle) !important;
    }

    .search .matching-post:hover {
      background: var(--bg-card-hover) !important;
    }

    /* ===================== COPY CODE BUTTON ===================== */
    .docsify-copy-code-button {
      background: var(--bg-glass) !important;
      color: var(--text-muted) !important;
      border: 1px solid var(--border-subtle) !important;
      border-radius: 6px !important;
      font-size: 0.75rem !important;
      padding: 4px 10px !important;
      transition: var(--transition) !important;
    }

    .docsify-copy-code-button:hover {
      background: var(--bg-card-hover) !important;
      color: var(--text-primary) !important;
    }

    /* ===================== SIDEBAR ENHANCEMENTS ===================== */
    .sidebar {
      background: var(--bg-secondary) !important;
      border-right: 1px solid var(--border-subtle) !important;
    }

    .sidebar .app-name {
      font-weight: 800;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: 1.1rem;
    }

    .sidebar ul li a {
      color: var(--text-secondary) !important;
      transition: var(--transition);
      border-radius: 6px;
      padding: 4px 8px !important;
    }

    .sidebar ul li a:hover {
      color: var(--accent-3) !important;
      background: var(--bg-glass);
    }

    .sidebar ul li.active > a {
      color: var(--accent-2) !important;
      font-weight: 600;
    }

    /* ===================== RESPONSIVE ===================== */
    @media (max-width: 768px) {
      .markdown-section {
        padding: 20px 20px 40px !important;
      }

      section.cover ul {
        flex-direction: column;
        align-items: center;
      }

      section.cover .cover-main > p:last-child {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      section.cover .cover-main > p:last-child a {
        margin: 0;
        width: 80%;
        text-align: center;
      }
    }

    /* ===================== ANIMATED FADE IN ===================== */
    .markdown-section > * {
      animation: fadeInUp 0.4s ease-out both;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Stagger animations for first few elements */
    .markdown-section > *:nth-child(1) { animation-delay: 0.05s; }
    .markdown-section > *:nth-child(2) { animation-delay: 0.1s; }
    .markdown-section > *:nth-child(3) { animation-delay: 0.15s; }
    .markdown-section > *:nth-child(4) { animation-delay: 0.2s; }
    .markdown-section > *:nth-child(5) { animation-delay: 0.25s; }

    /* ===================== FOOTER ===================== */
    .markdown-section > p:last-child em {
      display: block;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 2em 0 1em;
      border-top: 1px solid var(--border-subtle);
      margin-top: 3em;
    }
  </style>
</head>
<body>
  <div id="app">Inicializando motores de IA...</div>
  <script>
    window.$docsify = {
      name: '🚀 Agencia AI',
      repo: '',
      loadSidebar: false,
      homepage: 'index.md',
      coverpage: true,
      onlyCover: false,
      auto2top: true,
      maxLevel: 3,
      subMaxLevel: 2,
      themeColor: '#8b5cf6',
      search: {
        placeholder: '🔍 Buscar...',
        noData: 'No se encontraron resultados',
        depth: 3
      }
    }
  </script>

  <!-- Docsify Core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
</body>
</html>
